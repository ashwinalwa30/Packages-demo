<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>api-response-kit Live Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card: #111827;
      --border: #1f2937;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --primary: #6366f1;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      padding: 2rem 1rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container { max-width: 1000px; width: 100%; }
    header { text-align: center; margin-bottom: 2.5rem; }
    .badge {
      display: inline-block;
      padding: 0.35rem 0.85rem;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.4);
      color: #818cf8;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }
    h1 { font-size: 2.25rem; font-weight: 800; margin-bottom: 0.5rem; letter-spacing: -0.03em; }
    p.subtitle { color: var(--muted); font-size: 1.05rem; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 1.5rem;
    }
    .buttons { display: flex; flex-direction: column; gap: 0.75rem; }
    button {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.85rem 1.1rem;
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 0.6rem;
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    button:hover { background: #374151; border-color: var(--primary); }
    .status-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
      border-radius: 0.35rem;
    }
    .s-200 { background: rgba(16, 185, 129, 0.2); color: #34d399; }
    .s-201 { background: rgba(99, 102, 241, 0.2); color: #818cf8; }
    .s-401 { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
    .s-404 { background: rgba(239, 68, 68, 0.2); color: #f87171; }
    .s-422 { background: rgba(236, 72, 153, 0.2); color: #f472b6; }
    .s-500 { background: rgba(220, 38, 38, 0.3); color: #fca5a5; }
    pre {
      background: #090d16;
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1rem;
      overflow-x: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      color: #e5e7eb;
      min-height: 380px;
      max-height: 500px;
    }
    .meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
      font-size: 0.85rem;
      color: var(--muted);
    }
    a { color: #818cf8; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="badge">NPM Package Live Demo</div>
      <h1>@ashwinop/api-response-kit</h1>
      <p class="subtitle">Standardized success, error, pagination & request tracing for Express APIs</p>
      <div style="margin-top: 0.8rem; font-size: 0.9rem;">
        <a href="https://github.com/ashwinalwa30/Package" target="_blank">📦 GitHub Repo</a> &bull;
        <a href="https://www.npmjs.com/package/@ashwinop/api-response-kit" target="_blank">🚀 npm Package</a>
      </div>
    </header>

    <div class="grid">
      <div class="card">
        <h3 style="margin-bottom: 1rem; font-size: 1.1rem;">Click to Test Live Endpoints</h3>
        <div class="buttons">
          <button onclick="testRoute('/api/health')">
            <span>GET /api/health (Success)</span>
            <span class="status-tag s-200">200 OK</span>
          </button>
          <button onclick="testPostUser()">
            <span>POST /api/users (Created)</span>
            <span class="status-tag s-201">201 Created</span>
          </button>
          <button onclick="testRoute('/api/users?page=2&limit=2')">
            <span>GET /api/users (Paginated + Links)</span>
            <span class="status-tag s-200">200 Paginated</span>
          </button>
          <button onclick="testRoute('/api/users/99')">
            <span>GET /api/users/99 (Not Found)</span>
            <span class="status-tag s-404">404 ApiError</span>
          </button>
          <button onclick="testRoute('/api/protected')">
            <span>GET /api/protected (Unauthorized)</span>
            <span class="status-tag s-401">401 ApiError</span>
          </button>
          <button onclick="testRoute('/api/validation-demo')">
            <span>GET /api/validation-demo</span>
            <span class="status-tag s-422">422 Validation</span>
          </button>
          <button onclick="testRoute('/api/crash-demo')">
            <span>GET /api/crash-demo (500 Handler)</span>
            <span class="status-tag s-500">500 Error</span>
          </button>
        </div>
      </div>

      <div class="card">
        <div class="meta-bar">
          <span id="response-route">Endpoint: Click an action</span>
          <span id="response-status">Status: -</span>
        </div>
        <pre id="output">// Click any button on the left to inspect the standardized JSON response</pre>
      </div>
    </div>
  </div>

  <script>
    async function testRoute(path) {
      document.getElementById('response-route').innerText = `Endpoint: ${path}`;
      document.getElementById('output').innerText = 'Loading...';
      try {
        const res = await fetch(path);
        const data = await res.json();
        document.getElementById('response-status').innerText = `Status: ${res.status} ${res.statusText}`;
        document.getElementById('output').innerText = JSON.stringify(data, null, 2);
      } catch (err) {
        document.getElementById('output').innerText = err.message;
      }
    }

    async function testPostUser() {
      document.getElementById('response-route').innerText = 'Endpoint: POST /api/users';
      document.getElementById('output').innerText = 'Loading...';
      try {
        const res = await fetch('/api/users', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: 'Alex Rivera', email: 'alex@example.com', role: 'engineer' })
        });
        const data = await res.json();
        document.getElementById('response-status').innerText = `Status: ${res.status} ${res.statusText}`;
        document.getElementById('output').innerText = JSON.stringify(data, null, 2);
      } catch (err) {
        document.getElementById('output').innerText = err.message;
      }
    }
  </script>
</body>
</html>
